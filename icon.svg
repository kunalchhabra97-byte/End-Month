<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#F6EFE5"/>

  <!-- Calendar body -->
  <rect x="105" y="105" width="302" height="302" rx="52"
        fill="#E6DCCB"/>

  <!-- Calendar header -->
  <rect x="105" y="105" width="302" height="100" rx="52"
        fill="#85865B"/>
  <rect x="105" y="155" width="302" height="50"
        fill="#85865B"/>

  <!-- Calendar binding -->
  <rect x="166" y="76" width="30" height="92" rx="15"
        fill="#F6EFE5" stroke="#85865B" stroke-width="12"/>
  <rect x="316" y="76" width="30" height="92" rx="15"
        fill="#F6EFE5" stroke="#85865B" stroke-width="12"/>

  <!-- Calendar grid -->
  <g fill="#F6EFE5" opacity="0.85">
    <rect x="145" y="230" width="48" height="48" rx="14"/>
    <rect x="232" y="230" width="48" height="48" rx="14"/>
    <rect x="319" y="230" width="48" height="48" rx="14"/>
    <rect x="145" y="306" width="48" height="48" rx="14"/>
    <rect x="232" y="306" width="48" height="48" rx="14"/>
    <rect x="319" y="306" width="48" height="48" rx="14"/>
  </g>

  <!-- Premium embossed coin -->
  <circle cx="256" cy="284" r="93" fill="#85865B"/>
  <circle cx="256" cy="284" r="79" fill="#E6DCCB"
          stroke="#F6EFE5" stroke-width="8"/>
  <circle cx="256" cy="284" r="68" fill="#85865B"/>

  <!-- Rupee symbol -->
  <text x="256" y="316"
        font-family="Georgia, serif"
        font-size="100"
        font-weight="bold"
        text-anchor="middle"
        fill="#F6EFE5">₹</text>

  <!-- Subtle decorative detail -->
  <circle cx="256" cy="284" r="103"
          fill="none" stroke="#E6DCCB"
          stroke-width="4" opacity="0.7"/>
</svg>
